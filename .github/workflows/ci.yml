name: CI - Compilación y Pruebas

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # ==============================
    # AUTENTICACIÓN
    # ==============================
    - name: Compilar Autenticación
      run: dotnet build services/autenticacion/HomologaUTA.Autenticacion.Tests/HomologaUTA.Autenticacion.Tests.csproj

    - name: Probar Autenticación
      run: dotnet test services/autenticacion/HomologaUTA.Autenticacion.Tests/HomologaUTA.Autenticacion.Tests.csproj --no-build

    # ==============================
    # SOLICITUDES
    # ==============================
    - name: Compilar Solicitudes
      run: dotnet build services/solicitudes/HomologaUTA.Solicitudes.Tests/HomologaUTA.Solicitudes.Tests.csproj

    - name: Probar Solicitudes
      run: dotnet test services/solicitudes/HomologaUTA.Solicitudes.Tests/HomologaUTA.Solicitudes.Tests.csproj --no-build

    # ==============================
    # HOMOLOGACIÓN
    # ==============================
    - name: Compilar Homologación
      run: dotnet build services/HomologaUTA.Homologacion.Tests/HomologaUTA.Homologacion.Tests.csproj

    - name: Probar Homologación
      run: dotnet test services/HomologaUTA.Homologacion.Tests/HomologaUTA.Homologacion.Tests.csproj --no-build

    # ==============================
    # DOCUMENTOS
    # ==============================
    - name: Compilar Documentos
      run: dotnet build services/documentos/documentos.Tests/documentos.Tests.csproj

    - name: Probar Documentos
      run: dotnet test services/documentos/documentos.Tests/documentos.Tests.csproj --no-build

    # ==============================
    # REGLAS (solo compilar)
    # ==============================
    - name: Compilar Reglas
      run: dotnet build services/reglas/HomologaUTA.Reglas.csproj