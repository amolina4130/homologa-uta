version: '3.8'

services:
  # 1. Base de datos SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: homologa_sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - homologa_network

  # 2. Bus de Eventos (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: homologa_rabbitmq
    restart: always
    ports:
      - "5672:5672"   # Puerto para la comunicación entre microservicios
      - "15672:15672" # Puerto para el panel de administración web
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - homologa_network

  # 3. Servicio de Autenticación
  auth-service:
    build:
      context: ./services/autenticacion
      dockerfile: Dockerfile
    container_name: homologa_auth
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_AUTH};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver
    networks:
      - homologa_network

  # 4. Servicio de Solicitudes
  solicitudes-service:
    build:
      context: ./services/solicitudes
      dockerfile: Dockerfile
    container_name: homologa_solicitudes
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_SOLICITUDES};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
    ports:
      - "5002:8080"
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - homologa_network

  # 5. Servicio de Documentos
  documentos-service:
    build:
      context: ./services/documentos
      dockerfile: Dockerfile
    container_name: homologa_documentos
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_DOCUMENTOS};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
    ports:
      - "5003:8080"
    volumes:
      - pdf_data:/app/pdfs
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - homologa_network

  # 6. Gateway (YARP)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: homologa_gateway
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - solicitudes-service
      - documentos-service
    networks:
      - homologa_network

  # 7. Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homologa_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - homologa_network

volumes:
  sql_data:
  pdf_data:

networks:
  homologa_network:
    driver: bridge