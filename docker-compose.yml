services:
  # 1. Base de datos SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: homologa_sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-HomologaUTA_2026!}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - homologa_network

  # 2. RabbitMQ (Bus de Eventos)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: homologa_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - homologa_network

  # 3. Servicio de Autenticación
  auth-service:
    build:
      context: ./services/autenticacion
      dockerfile: Dockerfile
    container_name: homologa_auth
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_AUTH:-HomologaUTA_Auth};User Id=sa;Password=${SQL_SA_PASSWORD:-HomologaUTA_2026!};TrustServerCertificate=True;
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-HomologaUTA}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-HomologaUTA}
      - SEED_ESTUDIANTE_PASSWORD=${SEED_ESTUDIANTE_PASSWORD}
      - SEED_COORDINADOR_PASSWORD=${SEED_COORDINADOR_PASSWORD}
      - SEED_SECRETARIA_PASSWORD=${SEED_SECRETARIA_PASSWORD}
      - SEED_CONSEJO_PASSWORD=${SEED_CONSEJO_PASSWORD}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - homologa_network

  # 4. Servicio de Solicitudes
  solicitudes-service:
    build:
      context: ./services/solicitudes
      dockerfile: Dockerfile
    container_name: homologa_solicitudes
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_SOLICITUDES:-HomologaUTA_Solicitudes};User Id=sa;Password=${SQL_SA_PASSWORD:-HomologaUTA_2026!};TrustServerCertificate=True;
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - homologa_network

  # 5. Servicio de Documentos
  documentos-service:
    build:
      context: ./services/documentos
      dockerfile: Dockerfile
    container_name: homologa_documentos
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_DOCUMENTOS:-HomologaUTA_Documentos};User Id=sa;Password=${SQL_SA_PASSWORD:-HomologaUTA_2026!};TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
    ports:
      - "5003:8080"
    volumes:
      - pdf_data:/app/pdfs
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - homologa_network

  # 6. Servicio de Reglas
  reglas-service:
    build:
      context: ./services/reglas
      dockerfile: Dockerfile
    container_name: homologa_reglas
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_REGLAS:-HomologaUTA_Reglas};User Id=sa;Password=${SQL_SA_PASSWORD:-HomologaUTA_2026!};TrustServerCertificate=True;
    ports:
      - "5004:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - homologa_network

  # 7. Servicio de Homologación
  homologacion-service:
    build:
      context: ./services/homologacion
      dockerfile: Dockerfile
    container_name: homologa_homologacion
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_HOMOLOGACION:-HomologaUTA_Homologacion};User Id=sa;Password=${SQL_SA_PASSWORD:-HomologaUTA_2026!};TrustServerCertificate=True;
      - JWT_SECRET=${JWT_SECRET}
      - Ollama__Url=http://ollama:11434
      - RabbitMQ__Host=rabbitmq
      - Solicitudes__Url=http://solicitudes-service:8080
      - Documentos__Url=http://documentos-service:8080
    ports:
      - "5005:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      reglas-service:
        condition: service_started
      solicitudes-service:
        condition: service_started
      documentos-service:
        condition: service_started
      ollama:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - homologa_network

  # 8. Gateway (YARP)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: homologa_gateway
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-HomologaUTA}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-HomologaUTA}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - solicitudes-service
      - documentos-service
      - reglas-service
      - homologacion-service
    networks:
      - homologa_network

  # 9. Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homologa_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - homologa_network

  # 10. Ollama (Agente de IA)
  ollama:
    image: ollama/ollama:latest
    container_name: homologa_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - homologa_network

volumes:
  sql_data:
  pdf_data:
  ollama_data:

networks:
  homologa_network:
    driver: bridge
